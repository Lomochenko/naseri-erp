server {
    listen 80;
    server_name your-domain.com your-vps-ip;

    # Frontend static files (after npm run build)
    root /home/user/naseri/frontend/dist;
    index index.html;

    # Vue router - serve index.html for all frontend routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Django API
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Django admin + swagger
    location ~ ^/(admin|swagger|redoc|static)/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Django media files
    location /media/ {
        alias /home/user/naseri/backend/media/;
    }
}
