<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API Test - یراقالات ناصری</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            direction: rtl;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        .test-section {
            border: 1px solid #ddd;
            margin: 20px 0;
            padding: 20px;
            border-radius: 5px;
        }
        .success {
            background-color: #d4edda;
            border-color: #c3e6cb;
            color: #155724;
        }
        .error {
            background-color: #f8d7da;
            border-color: #f5c6cb;
            color: #721c24;
        }
        button {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 10px 20px;
            margin: 5px;
            border-radius: 3px;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
        input {
            padding: 8px;
            margin: 5px;
            border: 1px solid #ddd;
            border-radius: 3px;
        }
        pre {
            background-color: #f8f9fa;
            padding: 10px;
            border-radius: 3px;
            overflow-x: auto;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🧪 تست API سیستم یراقالات ناصری</h1>
        
        <!-- Login Test -->
        <div class="test-section">
            <h2>🔐 تست ورود</h2>
            <div>
                <input type="text" id="phone" placeholder="شماره تلفن" value="09122173180">
                <input type="password" id="password" placeholder="رمز عبور" value="Admin@123">
                <button onclick="testLogin()">تست ورود</button>
            </div>
            <div id="loginResult"></div>
        </div>

        <!-- API Tests -->
        <div class="test-section">
            <h2>📡 تست API ها</h2>
            <div>
                <button onclick="testCategories()">تست دسته‌بندی‌ها</button>
                <button onclick="testUnits()">تست واحدها</button>
                <button onclick="testProducts()">تست محصولات</button>
                <button onclick="testCustomers()">تست مشتریان</button>
            </div>
            <div id="apiResults"></div>
        </div>

        <!-- Create Product Test -->
        <div class="test-section">
            <h2>➕ تست ایجاد محصول</h2>
            <div>
                <input type="text" id="productName" placeholder="نام محصول" value="محصول تست">
                <input type="text" id="productCode" placeholder="کد محصول" value="TEST001">
                <button onclick="testCreateProduct()">ایجاد محصول</button>
            </div>
            <div id="createResult"></div>
        </div>
    </div>

    <script>
        const API_BASE = 'http://127.0.0.1:8000/api';
        let authToken = null;

        function showResult(elementId, success, message, data = null) {
            const element = document.getElementById(elementId);
            element.className = `test-section ${success ? 'success' : 'error'}`;
            element.innerHTML = `
                <h3>${success ? '✅ موفق' : '❌ خطا'}</h3>
                <p>${message}</p>
                ${data ? `<pre>${JSON.stringify(data, null, 2)}</pre>` : ''}
            `;
        }

        async function testLogin() {
            const phone = document.getElementById('phone').value;
            const password = document.getElementById('password').value;

            try {
                const response = await fetch(`${API_BASE}/users/login/`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        phone_number: phone,
                        password: password
                    })
                });

                const data = await response.json();

                if (response.ok) {
                    authToken = data.token;
                    showResult('loginResult', true, `ورود موفق! توکن: ${data.token.substring(0, 20)}...`, data);
                } else {
                    showResult('loginResult', false, `خطا در ورود: ${data.error || 'خطای نامشخص'}`, data);
                }
            } catch (error) {
                showResult('loginResult', false, `خطا در اتصال: ${error.message}`);
            }
        }

        async function testAPI(endpoint, name) {
            if (!authToken) {
                showResult('apiResults', false, 'ابتدا وارد شوید');
                return;
            }

            try {
                const response = await fetch(`${API_BASE}${endpoint}`, {
                    headers: {
                        'Authorization': `Token ${authToken}`,
                        'Content-Type': 'application/json',
                    }
                });

                const data = await response.json();

                if (response.ok) {
                    const count = data.results ? data.results.length : data.length || 0;
                    showResult('apiResults', true, `${name}: ${count} آیتم یافت شد`, data);
                } else {
                    showResult('apiResults', false, `خطا در ${name}: ${data.detail || 'خطای نامشخص'}`, data);
                }
            } catch (error) {
                showResult('apiResults', false, `خطا در اتصال به ${name}: ${error.message}`);
            }
        }

        function testCategories() {
            testAPI('/products/categories/', 'دسته‌بندی‌ها');
        }

        function testUnits() {
            testAPI('/products/units/', 'واحدها');
        }

        function testProducts() {
            testAPI('/products/', 'محصولات');
        }

        function testCustomers() {
            testAPI('/sales/customers/', 'مشتریان');
        }

        async function testCreateProduct() {
            if (!authToken) {
                showResult('createResult', false, 'ابتدا وارد شوید');
                return;
            }

            const name = document.getElementById('productName').value;
            const code = document.getElementById('productCode').value;

            try {
                const response = await fetch(`${API_BASE}/products/`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Token ${authToken}`,
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        name: name,
                        code: code,
                        description: 'محصول تست از HTML',
                        category: 1,
                        unit: 1,
                        purchase_price: 1000,
                        selling_price: 1500,
                        min_stock: 10,
                        is_active: true
                    })
                });

                const data = await response.json();

                if (response.ok) {
                    showResult('createResult', true, `محصول "${data.name}" با موفقیت ایجاد شد`, data);
                } else {
                    showResult('createResult', false, `خطا در ایجاد محصول: ${JSON.stringify(data)}`, data);
                }
            } catch (error) {
                showResult('createResult', false, `خطا در اتصال: ${error.message}`);
            }
        }

        // Auto-test login on page load
        window.onload = function() {
            testLogin();
        };
    </script>
</body>
</html>
